# ML-DSA keeps its polynomial vectors on the stack. Even with MLD_CONFIG_REDUCE_RAM
# (set in platform.mk), ML-DSA-87 keygen/sign/verify peaks around 60KB, so give
# the main thread a generous stack.
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_BOOT_BANNER=n
