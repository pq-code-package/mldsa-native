name: Mirror issues
permissions:
  contents: read
on:
  schedule:
    # Run hourly
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror sibling issues flagged for porting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Mirror issues and merged PRs flagged for porting
        run: python3 .github/scripts/mirror-issues.py
