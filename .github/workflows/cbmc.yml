name: CBMC
permissions:
  contents: read
on:
  workflow_call:
    secrets:
      AWS_GITHUB_TOKEN:
        description: Token for registering EC2 runners and reading the nix cache
        required: false
  workflow_dispatch:
  # Standalone trigger so the full CBMC run can be requested on an existing
  # PR by adding the `cbmc` label.
  pull_request:
    branches: ["main"]
    types: [ "labeled" ]

jobs:
  cbmc:
    name: CBMC (ML-DSA-${{ matrix.parameter_set }}${{ matrix.reduce_ram && ', REDUCE_RAM' || '' }})
    if: >-
      ${{ github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork &&
      (github.event.action != 'labeled' || github.event.label.name == 'cbmc') }}
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    strategy:
      fail-fast: false
      matrix:
        parameter_set: [44, 65, 87]
        # Pull requests without the `cbmc` label skip REDUCE_RAM.
        reduce_ram: >-
          ${{ fromJSON((github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'cbmc')) && '[false, true]' || '[false]') }}
    uses: ./.github/workflows/ci_ec2_reusable.yml
    with:
      name: CBMC (ML-DSA-${{ matrix.parameter_set }}${{ matrix.reduce_ram && ', REDUCE_RAM' || '' }})
      ec2_instance_type: c9g.4xlarge
      ec2_ami: ubuntu (aarch64)
      ec2_volume_size: 20
      platform: native
      opt: no_opt
      lint: false
      verbose: true
      test: false
      kattest: false
      acvptest: false
      cbmc: true
      cbmc_mldsa_parameter_set: ${{ matrix.parameter_set }}
      cbmc_reduce_ram: ${{ matrix.reduce_ram }}
      # Pull requests without the `cbmc` label run only default configurations.
      cbmc_all_configs: >-
        ${{ github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'cbmc') }}
    secrets:
      AWS_GITHUB_TOKEN: ${{ secrets.AWS_GITHUB_TOKEN }}
