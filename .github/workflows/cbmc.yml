name: CBMC
permissions:
  contents: read
on:
  workflow_call:
    secrets:
      AWS_GITHUB_TOKEN:
        description: GitHub token used to register/deregister EC2 self-hosted runners
        # Not required: on fork PRs this resolves empty and the fork-guarded EC2
        # jobs are skipped; the guards, not this flag, are the security control.
        required: false
  workflow_dispatch:

jobs:
  cbmc:
    name: CBMC (ML-DSA-${{ matrix.parameter_set }}${{ matrix.reduce_ram && ', REDUCE_RAM' || '' }})
    if: ${{ github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      matrix:
        parameter_set: [44, 65, 87]
        reduce_ram: [false, true]
    uses: ./.github/workflows/ci_ec2_reusable.yml
    with:
      name: CBMC (ML-DSA-${{ matrix.parameter_set }}${{ matrix.reduce_ram && ', REDUCE_RAM' || '' }})
      ec2_instance_type: c7g.4xlarge
      ec2_ami: ubuntu-latest (aarch64)
      ec2_volume_size: 20
      compile_mode: native
      opt: no_opt
      lint: false
      verbose: true
      functest: true
      kattest: false
      acvptest: false
      cbmc: true
      cbmc_mldsa_parameter_set: ${{ matrix.parameter_set }}
      cbmc_reduce_ram: ${{ matrix.reduce_ram }}
    secrets:
      AWS_GITHUB_TOKEN: ${{ secrets.AWS_GITHUB_TOKEN }}
