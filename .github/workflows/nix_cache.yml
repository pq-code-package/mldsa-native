# The nix caches are only refreshed from main, and CI does not run on
# pushes to main as merges are already tested in the merge queue.

name: Nix cache
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  check_modified_files:
    runs-on: ubuntu-latest
    outputs:
      run_needed: ${{ steps.check_run.outputs.run_needed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name != 'workflow_dispatch'
        with:
          # Enough history for changed-files (rebase-merge pushes can be multi-commit)
          fetch-depth: 100
      - name: Get changed files
        if: github.event_name != 'workflow_dispatch'
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - name: Check if dependencies changed
        id: check_run
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          if [[ ${{ (github.event_name == 'workflow_dispatch' && '1') || '0' }} == "1" ]]; then
            run_needed=1
          else
            run_needed=0
            dependencies="flake.lock flake.nix nix/"
            for changed in $CHANGED_FILES; do
              for needs in $dependencies; do
                 if [[ "$changed" == "$needs"* ]]; then
                   run_needed=1
                 fi
              done
            done
          fi
          echo "run_needed=${run_needed}" >> "$GITHUB_OUTPUT"

  nix:
    name: Nix setup
    permissions:
      actions: 'read'
      contents: 'read'
    uses: ./.github/workflows/nix.yml
  build_nix_cache:
    name: Build Nix cache (${{ matrix.runner }})
    needs: [ check_modified_files ]
    if: ${{ needs.check_modified_files.outputs.run_needed == '1' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: 'write'
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm, macos-latest ]
    concurrency:
      group: nix-cache-${{ matrix.runner }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-nix
        with:
          cache: true
          verbose: true
          save_cache: true
          devShell: ci
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            # We only run cross-compilation checks for x86 on macos-latest,
            # so restrict caching to the corresponding cross shell.
            if [[ ${{ runner.os }} == 'macOS' ]]; then
              nix develop .#cross-x86_64 --profile tmp-cross
            else
              nix develop .#cross --profile tmp-cross
              # GH ubuntu-24.04 image tend to run outof space
              if [[ ${{ matrix.runner }} == 'ubuntu-24.04' ]]; then
                nix-collect-garbage
              fi
            fi
            nix develop --profile tmp
            nix-collect-garbage
