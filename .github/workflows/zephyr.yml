name: Zephyr
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  zephyr_tests:
    name: Zephyr tests (${{ matrix.target.board }}, ${{ matrix.target.cpu }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { board: mps2-an385, cpu: Cortex-M3, opt: no_opt }
          - { board: mps2-an386, cpu: Cortex-M4, opt: no_opt }
          - { board: mps2-an500, cpu: Cortex-M7, opt: no_opt }
          - { board: mps2-an521, cpu: Cortex-M33, opt: no_opt }
          - { board: mps3-an547, cpu: Cortex-M55, opt: all }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: zephyr build + test
        uses: ./.github/actions/functest
        env:
          EXTRA_MAKEFILE: test/zephyr/platform.mk
          ZEPHYR_TARGET: ${{ matrix.target.board }}
        with:
          nix-shell: zephyr
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          opt: ${{ matrix.target.opt }}
          func: true
          kat: true
          acvp: true
          wycheproof: false
          examples: false
          unit: ${{ matrix.target.board == 'mps3-an547' }}
          stack: false
          alloc: false
          rng_fail: false
          check_namespace: false
          # Zephyr's CMake selects the target arch; disable the host-arch
          # auto-detection that would otherwise leak into the forwarded CFLAGS.
          extra_args: --no-auto
      # The default an547 backend is x1, so separately run the full test suite
      # with the retained x4 backend. Use a small QEMU-specific randomized
      # budget for the ordinary unit test rather than bypassing it.
      - name: Armv8.1-M x4 FIPS202 tests
        if: matrix.target.board == 'mps3-an547'
        uses: ./.github/actions/functest
        env:
          EXTRA_MAKEFILE: test/zephyr/platform.mk
          ZEPHYR_TARGET: mps3-an547
          ZEPHYR_FIPS202_BACKEND: fips202/native/armv81m/mve.h
        with:
          nix-shell: zephyr
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          opt: opt
          func: true
          kat: true
          acvp: true
          wycheproof: false
          examples: false
          unit: true
          stack: false
          alloc: false
          rng_fail: false
          check_namespace: false
          extra_env: NUM_RANDOM_TESTS=1 NUM_RANDOM_TESTS_SLOW=1
          extra_args: --no-auto
      # Smoke only: QEMU doesn't model cycle counts (real numbers come from the
      # FPGA); this just exercises the bench build + run.
      - name: bench (smoke)
        env:
          EXTRA_MAKEFILE: test/zephyr/platform.mk
          ZEPHYR_TARGET: ${{ matrix.target.board }}
        run: |
          opt=${{ matrix.target.opt == 'all' && 'opt' || 'no_opt' }}
          nix develop .#zephyr --command ./scripts/tests bench --no-auto -c NO --opt=$opt
          nix develop .#zephyr --command ./scripts/tests bench --no-auto --components -c NO --opt=$opt
