name: Extended
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build_kat:
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: macos-latest
           name: 'macOS (aarch64)'
           arch: mac
           mode: native
           # macos-latest is now the macOS 26 (Tahoe) image, whose clang 21
           # ASan runtime deadlocks at process startup (see backend_tests).
           # Build this target with clang 22, which carries the compiler-rt
           # fix (llvm/llvm-project#191039, backport #192082).
           nix_shell: clang22
         - runner: macos-15-intel
           name: 'macOS (x86_64)'
           arch: mac
           mode: native
           nix_shell: ci
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
           arch: aarch64
           mode: native
           nix_shell: ci
         - runner: ubuntu-24.04-arm
           name: 'aarch64, no Neon'
           arch: aarch64
           mode: native
           nix_shell: ci
           cflags: '-march=armv8-a+nosimd'
           extra_args: '--no-auto'
         - runner: ubuntu-24.04-arm
           name: 'x86_64, cross'
           arch: x86_64
           mode: cross-x86_64
           nix_shell: cross-x86_64
         - runner: ubuntu-24.04-arm
           name: 'x86_64, cross, no AVX2'
           arch: x86_64
           mode: cross-x86_64
           nix_shell: cross-x86_64
           exec_wrapper: 'qemu-x86_64 -cpu Snowridge'
           extra_args: '--no-auto'
         - runner: ubuntu-24.04-arm
           name: 'riscv64, cross, VLEN=128'
           arch: riscv64
           mode: cross-riscv64
           nix_shell: cross-riscv64
           vlen: 128
           exec_wrapper: 'qemu-riscv64 -cpu rv64,v=true,vlen=128'
         - runner: ubuntu-24.04-arm
           name: 'riscv64, cross, VLEN=256'
           arch: riscv64
           mode: cross-riscv64
           nix_shell: cross-riscv64
           vlen: 256
           exec_wrapper: 'qemu-riscv64 -cpu rv64,v=true,vlen=256'
         - runner: ubuntu-24.04-arm
           name: 'riscv64, cross, VLEN=512'
           arch: riscv64
           mode: cross-riscv64
           nix_shell: cross-riscv64
           vlen: 512
           exec_wrapper: 'qemu-riscv64 -cpu rv64,v=true,vlen=512'
         - runner: ubuntu-24.04-arm
           name: 'riscv64, cross, VLEN=1024'
           arch: riscv64
           mode: cross-riscv64
           nix_shell: cross-riscv64
           vlen: 1024
           exec_wrapper: 'qemu-riscv64 -cpu rv64,v=true,vlen=1024'
         - runner: ubuntu-24.04-arm
           name: 'riscv32, cross'
           arch: riscv32
           mode: cross-riscv32
           nix_shell: cross-riscv32
         - runner: ubuntu-24.04-arm
           name: 'ppc64le, cross'
           arch: ppc64le
           mode: cross-ppc64le
           nix_shell: cross-ppc64le
         - runner: ubuntu-latest
           name: 'x86_64'
           arch: x86_64
           mode: native
           nix_shell: ci
         - runner: ubuntu-latest
           name: 'aarch64, cross'
           arch: aarch64
           mode: cross-aarch64
           nix_shell: cross-aarch64
         - runner: ubuntu-latest
           name: 'aarch64_be, cross'
           arch: aarch64_be
           mode: cross-aarch64_be
           nix_shell: cross-aarch64_be
    name: Functional tests (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build + test (no-opt)
        uses: ./.github/actions/multi-functest
        # no-opt exercises only the C fallback, so RVV VLEN is irrelevant; run once for riscv64
        if: ${{ matrix.target.arch != 'riscv64' || matrix.target.vlen == 128 }}
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: ${{ matrix.target.mode == 'native' && 'false' || 'true' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: ${{ matrix.target.mode }}
          cflags: ${{ matrix.target.cflags || '' }}
          extra_args: ${{ matrix.target.extra_args || '' }}
          exec_wrapper: ${{ matrix.target.exec_wrapper || '' }}
          opt: 'no_opt'
      - name: build + test (+debug+memsan+ubsan, native)
        uses: ./.github/actions/multi-functest
        if: ${{ matrix.target.mode == 'native' }}
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          cflags: "${{ matrix.target.cflags || '' }} -DMLDSA_DEBUG -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
          ldflags: "-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
          extra_args: ${{ matrix.target.extra_args || '' }}
          check_namespace: 'false'
      - name: build + test (cross, opt)
        uses: ./.github/actions/multi-functest
        # There is no native code yet on PPC64LE, riscv32 or AArch64_be, so no point running opt tests
        if: ${{ matrix.target.mode != 'native' && (matrix.target.arch != 'ppc64le' && matrix.target.arch != 'riscv32' && matrix.target.arch != 'aarch64_be') }}
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: ${{ matrix.target.mode == 'native' && 'false' || 'true' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: ${{ matrix.target.mode }}
          cflags: ${{ matrix.target.cflags || '' }}
          extra_args: ${{ matrix.target.extra_args || '' }}
          exec_wrapper: ${{ matrix.target.exec_wrapper || '' }}
          opt: 'opt'
      - name: build + test (cross, opt, +debug)
        uses: ./.github/actions/multi-functest
        # There is no native code yet on PPC64LE, riscv32 or AArch64_be, so no point running opt tests
        if: ${{ matrix.target.mode != 'native' && (matrix.target.arch != 'ppc64le' && matrix.target.arch != 'riscv32' && matrix.target.arch != 'aarch64_be') }}
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: ${{ matrix.target.mode == 'native' && 'false' || 'true' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: ${{ matrix.target.mode }}
          extra_args: ${{ matrix.target.extra_args || '' }}
          exec_wrapper: ${{ matrix.target.exec_wrapper || '' }}
          cflags: "${{ matrix.target.cflags || '' }} -DMLDSA_DEBUG"
          opt: 'opt'
  backend_tests:
    name: AArch64 FIPS202 backends (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [x1_scalar, x1_v84a, x2_v84a, x4_v8a_scalar, x4_v8a_v84a_scalar]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build + test
        uses: ./.github/actions/multi-functest
        with:
          # clang 22 shell: the default `ci` shell's clang 21 ASan runtime
          # deadlocks at process startup on the macos-latest / macOS 26 (Tahoe)
          # image (compiler-rt shadow-memory init; same symptom as
          # python/cpython#145199), fixed in LLVM >= 22 by
          # llvm/llvm-project#191039 (backport #192082).
          nix-shell: 'clang22'
          nix-cache: 'false'
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: 'native'
          opt: 'opt'
          examples: 'false'
          cflags: "-DMLDSA_DEBUG -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
          ldflags: "-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all"
          check_namespace: 'false'
          extra_args: "--fips202-aarch64-backend ${{ matrix.backend }}"
  compiler_tests:
    name: Compiler tests  (${{ matrix.compiler.family }}-${{ matrix.compiler.version }}, ${{ matrix.target.name }}, ${{ matrix.cflags }})
    strategy:
      fail-fast: false
      matrix:
        cflags: [ "-O0", "-Os", "-O3" ]
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
         - runner: macos-latest
           name: 'macos'
        # Oldest available + 3 latest per family; intermediate versions run in legacy-compilers.
        compiler:
         - family: gcc
           version: "4.8"
           shell: gcc48
           darwin: False
           opt: all
           examples: true
         - family: gcc
           version: "14"
           shell: gcc14
           darwin: True
           opt: all
           examples: true
         - family: gcc
           version: "15"
           shell: gcc15
           darwin: True
           opt: all
           examples: true
         - family: gcc
           version: "16"
           shell: gcc16
           # TODO: re-add once gcc16 is no longer broken in nixpkgs-unstable
           darwin: False
           opt: all
           examples: true
         - family: clang
           version: "6"
           shell: clang6
           darwin: False
           opt: all
           examples: true
         - family: clang
           version: "20"
           shell: clang20
           darwin: True
           opt: all
           examples: true
         - family: clang
           version: "21"
           shell: clang21
           darwin: True
           opt: all
           examples: true
         - family: clang
           version: "22"
           shell: clang22
           darwin: True
           opt: all
           examples: true
         # CPU flags are not correctly passed to the zig assembler
         # https://github.com/ziglang/zig/issues/23576
         # We therefore only test the C backend
         #
         # We omit all examples since there is currently no way to run
         # only those examples not involving native code.
         #
         # zig 0.16 still appears affected on Linux (CPU-feature
         # predefines look to be dropped in assembler-with-cpp mode).
         - family: zig
           version: "0.10"
           shell: zig0_10
           darwin: False
           opt: no_opt
           examples: False
         - family: zig
           version: "0.14"
           shell: zig0_14
           darwin: True
           opt: no_opt
           examples: False
         - family: zig
           version: "0.15"
           shell: zig0_15
           darwin: True
           opt: no_opt
           examples: False
         - family: zig
           version: "0.16"
           shell: zig0_16
           darwin: True
           opt: no_opt
           examples: False
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: native build+functest (default)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "${{ matrix.cflags }}"
      - name: native build+functest (C90)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c90 ${{ matrix.cflags }}"
      - name: native build+functest (C99)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c99 ${{ matrix.cflags }}"
      - name: native build+functest (C11)
        if: ${{ matrix.compiler.darwin || matrix.target.runner != 'macos-latest' }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c11 ${{ matrix.cflags }}"
      - name: native build+functest (C17)
        if: ${{ (matrix.compiler.darwin || matrix.target.runner != 'macos-latest') &&
                (matrix.compiler.family == 'zig' || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 8) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 7)) }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c17 ${{ matrix.cflags }}"
      - name: native build+functest (C23)
        if: ${{ (matrix.compiler.darwin || matrix.target.runner != 'macos-latest') &&
                ((matrix.compiler.family == 'zig' && matrix.compiler.version >= 0.14) || (matrix.compiler.family == 'gcc' && matrix.compiler.version >= 14) || (matrix.compiler.family == 'clang' && matrix.compiler.version >= 18)) }}
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          func: true
          kat: false
          acvp: false
          wycheproof: false
          examples: ${{ matrix.compiler.examples }}
          opt: ${{ matrix.compiler.opt }}
          nix-shell: ${{ matrix.compiler.shell }}
          cflags: "-std=c23 ${{ matrix.cflags }}"
  stack_analysis:
    name: Stack analysis (${{ matrix.target.name }}, ${{ matrix.cflags }})
    strategy:
      fail-fast: false
      matrix:
        external:
         - ${{ github.repository_owner != 'pq-code-package' }}
        target:
          - runner: ubuntu-latest
            name: x86_64
          - runner: ubuntu-24.04-arm
            name: aarch64
        cflags:
          - '-O3'
          - '-Os'
          - '-O3 -DMLD_CONFIG_REDUCE_RAM'
          - '-Os -DMLD_CONFIG_REDUCE_RAM'
        exclude:
          - external: true
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stack analysis
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          nix-shell: valgrind-varlat_gcc15
          nix-cache: false
          opt: all
          cflags: "${{ matrix.cflags }}"
          func: false
          kat: false
          acvp: false
          wycheproof: false
          examples: false
          stack: true
          check_namespace: false
  unit_valgrind:
    name: Unit tests + valgrind (${{ matrix.target.name }}, ${{ matrix.cflags }})
    strategy:
      fail-fast: false
      matrix:
        external:
         - ${{ github.repository_owner != 'pq-code-package' }}
        target:
          - runner: ubuntu-latest
            name: x86_64
          - runner: ubuntu-24.04-arm
            name: aarch64
        cflags: ['-O3', '-Os']
        exclude:
          - external: true
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests under valgrind
        uses: ./.github/actions/functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: valgrind-varlat_gcc15
          nix-cache: false
          opt: opt
          cflags: "${{ matrix.cflags }} -std=c11 -D_GNU_SOURCE -DMLD_CONFIG_FILE=\\\\\\\"../test/configs/custom_heap_alloc_config.h\\\\\\\""
          func: false
          kat: false
          acvp: false
          wycheproof: false
          examples: false
          stack: false
          unit: true
          alloc: false
          sign_hook: false # Requires custom config
          rng_fail: false
          check_namespace: false
          # Disable AArch64 SHA3 extension: valgrind cannot emulate it
          extra_env: "MK_COMPILER_SUPPORTS_SHA3=0"
          exec_wrapper: "valgrind --error-exitcode=1"
  sign_hook_distribution:
    name: "Sign-hook attempt distribution (${{ matrix.target.name }}, ML-DSA-${{ matrix.level }})"
    strategy:
      fail-fast: false
      # One matrix entry per (architecture, parameter set): each level runs on
      # its own runner so the three ~9-minute 5M-signature runs proceed in
      # parallel rather than sequentially.
      matrix:
        external:
         - ${{ github.repository_owner != 'pq-code-package' }}
        target:
          - runner: ubuntu-latest
            name: x86_64
          - runner: ubuntu-24.04-arm
            name: aarch64
        level: [44, 65, 87]
        exclude:
          - external: true
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fresh random seed each run: the test draws fresh keys and signing
      # randomness from it, so this samples the attempts-per-signature
      # distribution anew every time. The seed is printed by the test, so a
      # failure is reproducible by re-running with the same SIGN_HOOK_SEED.
      - name: Generate random seed
        run: echo "SIGN_HOOK_SEED=seed=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'ci'
          # At 5,000,000 signatures, a deviation by more than +-0.5% (the 5
          # per-mille tolerance) is expected with probability < 10^{-30}.
          script: |
            CFLAGS=\"-DMLD_SIGN_HOOK_DIST_ITERATIONS=5000000 -DMLD_SIGN_HOOK_RATIO_TOL_PERMILLE=5\" make run_sign_hook_${{ matrix.level }} OPT=1 AUTO=1 -j$(nproc)
  config_variations:
    name: "Config: ${{ matrix.test.name }} (${{ matrix.target.name }})"
    strategy:
      fail-fast: false
      matrix:
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
        test:
         - name: pct
           ids: pct-enabled pct-enabled-broken
         - name: reduce-ram
           ids: reduce-ram reduce-ram-pct
         - name: custom-hooks
           ids: custom-alloc-heap custom-zeroize custom-randombytes custom-memcpy custom-memset custom-stdlib
         - name: native-cap
           ids: native-cap-ON native-cap-OFF native-cap-ID_AA64PFR1_EL1 native-cap-CPUID_AVX2
         - name: asm-fips202
           ids: no-asm serial-fips202
         - name: nblocks
           ids: nblocks-1 nblocks-4 nblocks-6
         - name: reduced-api
           ids: keygen-only sign-only verify-only keygen-sign keygen-verify sign-verify no-randomized
         - name: reduced-api-reduce-ram
           ids: keygen-only sign-only verify-only keygen-sign keygen-verify sign-verify no-randomized
           extra_cflags: -DMLD_CONFIG_REDUCE_RAM
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Config: ${{ matrix.test.name }} (${{ matrix.target.name }})"
        uses: ./.github/actions/config-variations
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          tests: ${{ matrix.test.ids }}
          extra_cflags: ${{ matrix.test.extra_cflags || '' }}
  check-cf-protections:
    name: Test control-flow protections  (${{ matrix.compiler.name }}, x86_64)
    strategy:
      fail-fast: false
      matrix:
        compiler:
         - name: gcc-14
           shell: gcc14
         - name: gcc-15
           shell: gcc15
         - name: clang-19
           shell: clang19
    # On AArch64 -fcf-protection is not supported anyway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test control-flow protections
        uses: ./.github/actions/multi-functest
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          compile_mode: native
          cflags: "-Wl,-z,cet-report=error -fcf-protection=full"
          func: true
          kat: true
          acvp: true
          nix-shell: ${{ matrix.compiler.shell }}
  # ensure that sign.h and mldsa_native.h; api.h and native backends are compatible
  check-apis:
    strategy:
      fail-fast: false
      matrix:
        external:
         - ${{ github.repository_owner != 'pq-code-package' }}
        target:
         - runner: ubuntu-24.04-arm
           name: 'aarch64'
         - runner: ubuntu-latest
           name: 'x86_64'
        exclude:
          - {external: true,
             target: {
               runner: ubuntu-24.04-arm,
               name: 'aarch64'
             }}
    name: Check API consistency
    runs-on: ${{ matrix.target.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make quickcheck
        run: |
          OPT=0 CFLAGS="-Imldsa -DMLD_CHECK_APIS -Wno-redundant-decls" make quickcheck
          make clean >/dev/null
          OPT=1 CFLAGS="-Imldsa -DMLD_CHECK_APIS -Wno-redundant-decls" make quickcheck
      - uses: ./.github/actions/setup-apt
      - name: tests func
        run: |
          ./scripts/tests func --cflags="-Imldsa -DMLD_CHECK_APIS -Wno-redundant-decls"
  ec2_functests:
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: AMD EPYC 4th gen (t3a)
            ec2_instance_type: t3a.small
            ec2_ami: ubuntu-latest (x86_64)
            ec2_volume_size: 30
            compile_mode: native
            opt: all
            config_variations: 'native-cap-CPUID_AVX2'
          - name: Intel Xeon 4th gen (t3)
            ec2_instance_type: t3.small
            ec2_ami: ubuntu-latest (x86_64)
            ec2_volume_size: 30
            compile_mode: native
            opt: all
            config_variations: 'native-cap-CPUID_AVX2'
          - name: Graviton2 (c6g.medium)
            ec2_instance_type: c6g.medium
            ec2_ami: ubuntu-latest (aarch64)
            ec2_volume_size: 20
            compile_mode: native
            opt: all
            config_variations: 'native-cap-ON native-cap-OFF native-cap-ID_AA64PFR1_EL1'
          - name: Graviton3 (c7g.medium)
            ec2_instance_type: c7g.medium
            ec2_ami: ubuntu-latest (aarch64)
            ec2_volume_size: 20
            compile_mode: native
            opt: all
            config_variations: 'native-cap-ID_AA64PFR1_EL1'
    name: Platform tests  (${{ matrix.target.name }})
    permissions:
      contents: 'read'
      id-token: 'write'
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/ci_ec2_reusable.yml
    with:
      name: ${{ matrix.target.name }}
      ec2_instance_type: ${{ matrix.target.ec2_instance_type }}
      ec2_ami: ${{ matrix.target.ec2_ami }}
      ec2_volume_size: ${{ matrix.target.ec2_volume_size }}
      compile_mode: ${{ matrix.target.compile_mode }}
      opt: ${{ matrix.target.opt }}
      config_variations: ${{ matrix.target.config_variations || '' }}
      functest: true
      kattest: true
      acvptest: true
      lint: false
      verbose: true
    secrets: inherit
  compatibility_tests:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        container:
          - id: debian:bullseye
            nix_shell: ''
          - id: debian:bookworm
            nix_shell: ''
          - id: nixos/nix:latest
            nix_shell: 'nix-shell -p python3 gcc gnumake perl'
    name: Compatibility tests (${{ matrix.container.id }})
    runs-on: ubuntu-latest
    container:
      ${{ matrix.container.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # We're not using the checkout action here because on it's not supported
      # on all containers we want to test. Resort to a manual checkout.

      # We can't hoist this into an action since calling an action can only
      # be done after checkout.
      - name: Manual checkout
        shell: bash
        run: |
          if (which yum > /dev/null); then
             yum install git -y
          elif (which apt > /dev/null); then
             apt update
             apt install git -y
          fi

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch origin --depth 1 "$GITHUB_SHA"
          git checkout FETCH_HEAD
      - uses: ./.github/actions/setup-os
        with:
          sudo: ""
      - name: make quickcheck
        shell: bash
        run: |
          if [ -n "${{ matrix.container.nix_shell }}" ]; then
            ${{ matrix.container.nix_shell }} --run "CC=gcc OPT=0 make quickcheck && make clean >/dev/null && CC=gcc OPT=1 make quickcheck"
          else
            CC=gcc OPT=0 make quickcheck
            make clean >/dev/null
            CC=gcc OPT=1 make quickcheck
          fi
      - name: Functional Tests
        uses: ./.github/actions/multi-functest
        with:
          nix-shell: ""
          custom_shell: ${{ matrix.container.nix_shell && format('{0} --run \"bash -e {{0}}\"', matrix.container.nix_shell) || 'bash' }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
  ec2_compatibilitytests:
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        container:
          - id: amazonlinux-2-aarch:base
            # Python 3.7 on Amazon Linux 2 lacks `sha512_224` in hashlib; skip the affected acvp test cases.
            quickcheck: true
            acvptest: true
            acvp_options: --skip-unsupported
          - id: amazonlinux-2-aarch:gcc-7x
            # Python 3.7 on Amazon Linux 2 lacks `sha512_224` in hashlib; skip the affected acvp test cases.
            quickcheck: true
            acvptest: true
            acvp_options: --skip-unsupported
          - id: amazonlinux-2-aarch:clang-7x
            # Python 3.7 on Amazon Linux 2 lacks `sha512_224` in hashlib; skip the affected acvp test cases.
            quickcheck: true
            acvptest: true
            acvp_options: --skip-unsupported
          - id: amazonlinux-2023-aarch:base
            quickcheck: true
            acvptest: true
          - id: amazonlinux-2023-aarch:gcc-11x
            quickcheck: true
            acvptest: true
          - id: amazonlinux-2023-aarch:clang-15x
            quickcheck: true
            acvptest: true
          - id: amazonlinux-2023-aarch:clang-15x-sanitizer
            quickcheck: true
            acvptest: true
          # - id: amazonlinux-2023-aarch:cryptofuzz Not yet supported
          - id: ubuntu-22.04-aarch:gcc-12x
            quickcheck: true
            acvptest: true
          - id: ubuntu-22.04-aarch:gcc-11x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:gcc-8x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:gcc-7x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:clang-9x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:clang-8x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:clang-7x-bm-framework
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:clang-7x
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:clang-10x
            quickcheck: true
            acvptest: true
          - id: ubuntu-22.04-aarch:base
            quickcheck: true
            acvptest: true
          - id: ubuntu-20.04-aarch:base
            quickcheck: true
            acvptest: true
    name: Compatibility tests (${{ matrix.container.id }})
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/ci_ec2_container.yml
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    with:
      container: ${{ matrix.container.id }}
      name: ${{ matrix.container.id }}
      ec2_instance_type: t4g.small
      ec2_ami: ubuntu-latest (custom AMI)
      ec2_ami_id: ami-0c9bc1901ef0d1066 # Has docker images preinstalled
      compile_mode: native
      opt: all
      functest: true
      kattest: true
      acvptest: ${{ matrix.container.acvptest }}
      quickcheck: ${{ matrix.container.quickcheck }}
      acvp_options: ${{ matrix.container.acvp_options }}
      lint: false
      verbose: true
      cflags: "-O0"
    secrets: inherit
  check_autogenerated_files:
    strategy:
      fail-fast: false
      matrix:
        target:
          - system: macos-latest
            nix_shell: 'cross-autogen'
            nix_cache: 'true'
            extra_args: '--force-cross'
          # TODO: This does not yet work (#1304) <- MLKEM ISSUE, Port when fixed
          # - system: macos-15-intel
          #   nix_cache: 'false'
          #   nix_shell: 'ci'
          - system: ubuntu-latest
            nix_shell: 'cross-autogen'
            nix_cache: 'true'
            extra_args: '--force-cross'
          - system: ubuntu-24.04-arm
            nix_shell: 'cross-autogen'
            nix_cache: 'true'
            extra_args: '--force-cross'
    runs-on: ${{ matrix.target.system }}
    name: Check autogenerated files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-shell
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: ${{ matrix.target.nix_cache }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            python3 ./scripts/autogen --dry-run ${{ matrix.target.extra_args }}
  check_test_vectors:
    runs-on: ubuntu-latest
    name: Check test vectors
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-shell
        with:
          nix-shell: ci
          nix-cache: 'true'
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            make acvp OPT=0
            python3 ./scripts/autogen --test-vectors --dry-run
  check_hol_light_object_code:
    strategy:
      fail-fast: false
      matrix:
        target:
          - system: macos-latest
            nix_cache: 'true'
            nix_shell: 'hol_light-cross-x86_64'
            extra_args: '--force-cross aarch64 x86_64'
          # TODO: autogen does not yet work on macos15-intel (#1304)
          # - system: macos-15-intel
          #   nix_cache: 'false'
          #   nix_shell: 'ci'
          - system: ubuntu-latest
            nix_shell: 'hol_light-cross-aarch64'
            nix_cache: 'true'
            extra_args: '--force-cross aarch64 x86_64'
          - system: ubuntu-24.04-arm
            nix_shell: 'hol_light-cross-x86_64'
            nix_cache: 'true'
            extra_args: '--force-cross aarch64 x86_64'
    runs-on: ${{ matrix.target.system }}
    name: Check object code in HOL-Light proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-shell
        with:
          nix-shell: ${{ matrix.target.nix_shell }}
          nix-cache: ${{ matrix.target.nix_cache }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            python3 ./scripts/autogen --dry-run --update-hol-light-bytecode ${{ matrix.target.extra_args }}
