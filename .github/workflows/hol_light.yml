name: HOL-Light
permissions:
  contents: read
on:
  push:
    branches: ["main"]
    paths:
     - '.github/workflows/hol_light.yml'
     - 'proofs/hol_light/common/**/*.ml'
     - 'proofs/hol_light/aarch64/Makefile'
     - 'proofs/hol_light/aarch64/**/*.S'
     - 'proofs/hol_light/aarch64/**/*.ml'
     - 'proofs/hol_light/common/**/*.ml'
     - 'proofs/hol_light/x86_64/Makefile'
     - 'proofs/hol_light/x86_64/**/*.S'
     - 'proofs/hol_light/x86_64/**/*.ml'
     - 'flake.nix'
     - 'flake.lock'
     - 'nix/hol_light/*'
     - 'nix/s2n_bignum/*'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/hol_light.yml'
      - 'proofs/hol_light/common/**/*.ml'
      - 'proofs/hol_light/aarch64/Makefile'
      - 'proofs/hol_light/aarch64/**/*.S'
      - 'proofs/hol_light/aarch64/**/*.ml'
      - 'proofs/hol_light/common/**/*.ml'
      - 'proofs/hol_light/x86_64/Makefile'
      - 'proofs/hol_light/x86_64/**/*.S'
      - 'proofs/hol_light/x86_64/**/*.ml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/hol_light/*'
      - 'nix/s2n_bignum/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The proofs also check that the byte code is up to date,
  # but we use this as a fast path to not even start the proofs
  # if the byte code needs updating.
  hol_light_bytecode:
    name: AArch64 HOL-Light bytecode check
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            autogen --update-hol-light-bytecode --dry-run
  hol_light_interactive:
    name: AArch64 HOL-Light interactive shell test
    runs-on: ubuntu-24.04-arm
    needs: [ hol_light_bytecode ]
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            make -C proofs/hol_light/aarch64 mldsa/poly_caddq_aarch64_asm.o
            echo 'needs "aarch64/proofs/poly_caddq_aarch64_asm.ml";;' | hol.sh
  hol_light_proofs:
    needs: [ hol_light_bytecode ]
    strategy:
      fail-fast: false
      matrix:
        proof:
          # Dependencies on {name}.{S,ml} are implicit
          - name: ntt_aarch64_asm
            needs: ["mldsa_specs.ml", "mldsa_zetas.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: intt_aarch64_asm
            needs: ["mldsa_specs.ml", "mldsa_zetas.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: pointwise_montgomery_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: mld_polyvecl_pointwise_acc_montgomery_l4_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: mld_polyvecl_pointwise_acc_montgomery_l5_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: mld_polyvecl_pointwise_acc_montgomery_l7_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: poly_caddq_aarch64_asm
            needs: ["aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: poly_chknorm_aarch64_asm
            needs: ["aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: poly_use_hint_32_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: poly_use_hint_88_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x1_scalar_aarch64_asm
            needs: ["keccak_spec.ml", "keccak_constants.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x1_v84a_aarch64_asm
            needs: ["keccak_spec.ml", "keccak_constants.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x2_v84a_aarch64_asm
            needs: ["keccak_spec.ml", "keccak_constants.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x4_v8a_scalar_hybrid_aarch64_asm
            needs: ["keccak_spec.ml", "keccak_utils.ml", "keccak_constants.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x4_v8a_v84a_scalar_hybrid_aarch64_asm
            needs: ["keccak_spec.ml", "keccak_utils.ml", "keccak_constants.ml", "subroutine_signatures.ml"]
          - name: polyz_unpack_17_aarch64_asm
            needs: ["aarch64_utils.ml", "mldsa_polyz_unpack_consts.ml", "mldsa_specs.ml", "subroutine_signatures.ml"]
          - name: polyz_unpack_19_aarch64_asm
            needs: ["aarch64_utils.ml", "mldsa_polyz_unpack_consts.ml", "mldsa_specs.ml", "subroutine_signatures.ml"]
          - name: poly_decompose_32_aarch64_asm
            needs: ["aarch64_utils.ml", "mldsa_specs.ml", "subroutine_signatures.ml"]
          - name: poly_decompose_88_aarch64_asm
            needs: ["aarch64_utils.ml", "mldsa_specs.ml", "subroutine_signatures.ml"]
          - name: rej_uniform_aarch64_asm
            needs: ["mldsa_specs.ml", "aarch64_utils.ml", "mldsa_rej_uniform_table.ml"]
    name: AArch64 HOL Light proof for ${{ matrix.proof.name }}.S
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - name: Check if dependencies changed
        id: check_run
        shell: bash
        run: |
          run_needed=0
          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
          dependencies="${{ join(matrix.proof.needs, ' ') }} ${{ format('{0}.S {0}.ml', matrix.proof.name) }}"
          for changed in $changed_files; do
            for needs in $dependencies; do
               if [[ "$changed" == *"$needs" ]]; then
                 run_needed=1
               fi
            done
          done

          # Always re-run upon change to nix files for HOL-Light
          if [[ "$changed_files" == *"nix/"* ]] || [[ "$changed_files" == *"hol_light.yml"* ]] || [[ "$changed_files" == *"flake"* ]] || [[ "$changed_files" == *"proofs/hol_light/aarch64/Makefile"* ]]; then
            run_needed=1
          fi

          echo "run_needed=${run_needed}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-shell
        if: |
          steps.check_run.outputs.run_needed == '1'
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            tests hol_light -p ${{ matrix.proof.name }} --verbose

  # x86_64 proofs
  hol_light_bytecode_x86_64:
    name: x86_64 HOL-Light bytecode check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            autogen --update-hol-light-bytecode --dry-run
  hol_light_interactive_x86_64:
    name: x86_64 HOL-Light interactive shell test
    runs-on: ubuntu-latest
    needs: [ hol_light_bytecode_x86_64 ]
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            # TODO: Enable when we have a cheaper proof
            # make -C proofs/hol_light/x86_64 mldsa/ntt_avx2_asm.o
            # echo 'needs "x86_64/proofs/ntt_avx2_asm.ml";;' | hol.sh
            echo 'needs "x86/proofs/base.ml";; needs "common/mldsa_specs.ml";; #quit;;' | hol.sh
  hol_light_proofs_x86_64:
    needs: [ hol_light_bytecode_x86_64 ]
    strategy:
      fail-fast: false
      matrix:
        proof:
          # Dependencies on {name}.{S,ml} are implicit
          - name: poly_caddq_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "subroutine_signatures.ml"]
          - name: ntt_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml", "subroutine_signatures.ml"]
          - name: intt_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml", "subroutine_signatures.ml"]
          - name: nttunpack_avx2_asm
            needs: ["mldsa_specs.ml", "subroutine_signatures.ml"]
          - name: pointwise_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml"]
          - name: pointwise_acc_l4_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml", "subroutine_signatures.ml"]
          - name: pointwise_acc_l5_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml", "subroutine_signatures.ml"]
          - name: pointwise_acc_l7_avx2_asm
            needs: ["mldsa_specs.ml", "mldsa_utils.ml", "mldsa_zetas.ml", "subroutine_signatures.ml"]
          - name: keccak_f1600_x4_avx2_asm
            needs: ["keccak_utils.ml", "keccak_spec.ml", "keccak_f1600_x4_avx2_constants.ml", "keccak_constants.ml"]
    name: x86_64 HOL Light proof for ${{ matrix.proof.name }}.S
    runs-on: ubuntu-latest
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - name: Check if dependencies changed
        id: check_run
        shell: bash
        run: |
          run_needed=0
          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
          dependencies="${{ join(matrix.proof.needs, ' ') }} ${{ format('{0}.S {0}.ml', matrix.proof.name) }}"
          for changed in $changed_files; do
            for needs in $dependencies; do
               if [[ "$changed" == *"$needs" ]]; then
                 run_needed=1
               fi
            done
          done

          # Always re-run upon change to nix files for HOL-Light
          if [[ "$changed_files" == *"nix/"* ]] || [[ "$changed_files" == *"hol_light.yml"* ]] || [[ "$changed_files" == *"flake"* ]] || [[ "$changed_files" == *"proofs/hol_light/x86_64/Makefile"* ]]; then
            run_needed=1
          fi

          echo "run_needed=${run_needed}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-shell
        if: |
          steps.check_run.outputs.run_needed == '1'
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            tests hol_light -p ${{ matrix.proof.name }} --verbose
