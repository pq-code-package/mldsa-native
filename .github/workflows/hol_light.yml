name: HOL-Light
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hol-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Select the proofs that the change can affect, with
  # proofs/hol_light/scripts/deps rev, from proofs/hol_light/deps.yml.
  # The owner/fork guard lives here, so on forks all downstream jobs skip too.
  check_modified_files:
    name: Determine changed files
    runs-on: ubuntu-latest
    if: github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork
    outputs:
      run_needed: ${{ steps.select.outputs.run_needed }}
      aarch64: ${{ steps.select.outputs.aarch64 }}
      x86_64: ${{ steps.select.outputs.x86_64 }}
      riscv32: ${{ steps.select.outputs.riscv32 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Enough history for changed-files (rebase-merge pushes can be multi-commit)
          fetch-depth: 100
      - name: Get changed files
        id: changed-files
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - uses: ./.github/actions/setup-apt
        with:
          packages: python3-yaml
      - name: Select proofs
        id: select
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_and_modified_files }}
          ALL_PROOFS: ${{ github.event_name == 'workflow_dispatch' || contains(steps.changed-files.outputs.all_changed_and_modified_files, '.github/workflows/hol_light.yml') }}
        run: |
          all=()
          if [[ "$ALL_PROOFS" == "true" ]]; then
            all=(--all)
          fi
          # shellcheck disable=SC2086 # one argument per changed file
          selected=$(/usr/bin/python3 proofs/hol_light/scripts/deps rev --json "${all[@]}" $CHANGED_FILES)
          echo "Selected proofs: $selected"
          {
            echo "aarch64=$(jq -c .aarch64 <<<"$selected")"
            echo "x86_64=$(jq -c .x86_64 <<<"$selected")"
            echo "riscv32=$(jq -c .riscv32 <<<"$selected")"
            echo "run_needed=$(jq '[.[] | length] | add > 0' <<<"$selected")"
          } >> "$GITHUB_OUTPUT"
  # The proofs also check that the byte code is up to date,
  # but we use this as a fast path to not even start the proofs
  # if the byte code needs updating.
  hol_light_bytecode:
    name: AArch64 HOL-Light bytecode check
    runs-on: ubuntu-24.04-arm
    needs: [ check_modified_files ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            autogen --update-hol-light-bytecode --dry-run
  hol_light_interactive:
    name: AArch64 HOL-Light interactive shell test
    runs-on: ubuntu-24.04-arm
    needs: [ check_modified_files, hol_light_bytecode ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            make -C proofs/hol_light/aarch64 mldsa/mldsa_poly_caddq_aarch64_asm.o
            echo 'needs "aarch64/proofs/mldsa_poly_caddq_aarch64_asm.ml";;' | hol.sh
  hol_light_proofs:
    needs: [ check_modified_files, hol_light_bytecode ]
    if: needs.check_modified_files.outputs.aarch64 != '[]'
    strategy:
      fail-fast: false
      matrix:
        proof: ${{ fromJSON(needs.check_modified_files.outputs.aarch64) }}
    name: AArch64 HOL Light proof for ${{ matrix.proof }}.S
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            tests hol_light -p ${{ matrix.proof }} --verbose

  # x86_64 proofs
  hol_light_bytecode_x86_64:
    name: x86_64 HOL-Light bytecode check
    runs-on: ubuntu-latest
    needs: [ check_modified_files ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            autogen --update-hol-light-bytecode --dry-run
  hol_light_interactive_x86_64:
    name: x86_64 HOL-Light interactive shell test
    runs-on: ubuntu-latest
    needs: [ check_modified_files, hol_light_bytecode_x86_64 ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            # TODO: Enable when we have a cheaper proof
            # make -C proofs/hol_light/x86_64 mldsa/mldsa_ntt_avx2_asm.o
            # echo 'needs "x86_64/proofs/mldsa_ntt_avx2_asm.ml";;' | hol.sh
            echo 'needs "x86/proofs/base.ml";; needs "common/mldsa_specs.ml";; #quit;;' | hol.sh
  hol_light_proofs_x86_64:
    needs: [ check_modified_files, hol_light_bytecode_x86_64 ]
    if: needs.check_modified_files.outputs.x86_64 != '[]'
    strategy:
      fail-fast: false
      matrix:
        proof: ${{ fromJSON(needs.check_modified_files.outputs.x86_64) }}
    name: x86_64 HOL Light proof for ${{ matrix.proof }}.S
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light'
          script: |
            tests hol_light -p ${{ matrix.proof }} --verbose

  # RV32IM proofs
  hol_light_bytecode_riscv32:
    name: RV32IM HOL-Light bytecode check
    runs-on: ubuntu-latest
    needs: [ check_modified_files ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light-cross-riscv32'
          script: |
            autogen --update-hol-light-bytecode --dry-run \
              --force-cross riscv32
  hol_light_interactive_riscv32:
    name: RV32IM HOL-Light interactive shell test
    runs-on: ubuntu-latest
    needs: [ check_modified_files, hol_light_bytecode_riscv32 ]
    if: needs.check_modified_files.outputs.run_needed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light-cross-riscv32'
          script: |
            echo 'needs "mldsa_native/riscv32/proofs/mldsa_specs_aux.ml";; #quit;;' | hol.sh
  hol_light_proofs_riscv32:
    needs: [ check_modified_files, hol_light_bytecode_riscv32 ]
    if: needs.check_modified_files.outputs.riscv32 != '[]'
    strategy:
      fail-fast: false
      matrix:
        proof: ${{ fromJSON(needs.check_modified_files.outputs.riscv32) }}
    name: RV32IM HOL Light proof for ${{ matrix.proof }}.S
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          nix-shell: 'hol_light-cross-riscv32'
          script: |
            tests hol_light -a riscv32 \
              -p ${{ matrix.proof }} --verbose
