name: Bench mldsa-native
description: Run benchmarking script

inputs:
  name:
    description: Name for the benchmarking run
    required: true
  perf:
    description: Method of obtaining PMU metrics
    required: true
    default: "PERF"
  cflags:
    description: CFLAGS to pass to compilation
    default: ""
  archflags:
    description: ARCHFLAGS to pass to compilation
    default: ""
  ldflags:
    description: LDFLAGS to pass to compilation
    default: ""
  opt:
    description: opt flag to set for tests script
    default: "true"
  bench_extra_args:
    description: Newline-delimited additional arguments for the `bench` script
    default: ""
  store_results:
    description: Whether to push results to GH pages
    default: "false"
  gh_token:
    description: GitHub access token
    required: true
  nix-shell:
    description: Run in the specified Nix environment if exists
    default: "bench"
  nix-cache:
    description: Determine whether to enable nix cache
    default: 'false'
  nix-verbose:
    description: Determine wether to suppress nix log or not
    default: 'false'
  custom_shell:
    description: The shell to use. Only relevant if no nix-shell specified
    default: "bash"
  cross_prefix:
    description: "Binary prefix for cross-compilation builds"
    default: ""
  alert_threshold:
    description: "Set alert threshold in percentage for benchmark result"
    default: "103%"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-shell
      env:
        BENCH_CROSS_PREFIX: ${{ inputs.cross_prefix }}
      with:
        nix-shell: ${{ inputs.nix-shell }}
        nix-cache: ${{ inputs.nix-cache }}
        nix-verbose: ${{ inputs.nix-verbose }}
        gh_token: ${{ inputs.gh_token }}
        custom_shell: ${{ inputs.custom_shell }}
        script: |
          safe_cross_prefix_re='^[A-Za-z0-9_./+-]*$'
          if [[ ! "$BENCH_CROSS_PREFIX" =~ $safe_cross_prefix_re ]]; then
            printf 'cross_prefix contains unsupported characters\n' >&2
            exit 1
          fi
          ARCH=$(uname -m)
          cat >> $GITHUB_STEP_SUMMARY <<-EOF
            ## Setup
            Architecture: $ARCH
            - $(uname -a)
            - $(nix --version)
            - $("${BENCH_CROSS_PREFIX}gcc" --version | grep -m1 "")
            - $(bash --version | grep -m1 "")

            ## CPU Info
            $(cat /proc/cpuinfo)
          EOF
    - name: Run benchmark
      shell: ${{ env.SHELL }}
      env:
        BENCH_ARCHFLAGS: ${{ inputs.archflags }}
        BENCH_CFLAGS: ${{ inputs.cflags }}
        BENCH_CROSS_PREFIX: ${{ inputs.cross_prefix }}
        BENCH_EXTRA_ARGS: ${{ inputs.bench_extra_args }}
        BENCH_LDFLAGS: ${{ inputs.ldflags }}
        BENCH_OPT: ${{ inputs.opt }}
        BENCH_PERF: ${{ inputs.perf }}
      run: |
        validate_value() {
          local name=$1
          local value=$2
          local pattern=$3
          if [[ ! "$value" =~ $pattern ]]; then
            printf '%s contains unsupported characters\n' "$name" >&2
            exit 1
          fi
        }

        validate_value perf "$BENCH_PERF" '^(NO|PMU|PERF|MAC)$'
        validate_value cross_prefix "$BENCH_CROSS_PREFIX" '^[A-Za-z0-9_./+-]*$'
        validate_value cflags "$BENCH_CFLAGS" '^[A-Za-z0-9_.,:+=/@% -]*$'
        validate_value archflags "$BENCH_ARCHFLAGS" '^[A-Za-z0-9_.,:+=/@% -]*$'
        validate_value ldflags "$BENCH_LDFLAGS" '^[A-Za-z0-9_.,:+=/@% -]*$'

        if [[ "$BENCH_OPT" == "false" ]]; then
          bench_opt=no_opt
        elif [[ "$BENCH_OPT" == "true" ]]; then
          bench_opt=opt
        else
          printf 'opt must be true or false\n' >&2
          exit 1
        fi

        extra_args=()
        if [[ -n "$BENCH_EXTRA_ARGS" ]]; then
          while IFS= read -r arg; do
            [[ -z "$arg" ]] && continue
            extra_args+=("$arg")
          done <<< "$BENCH_EXTRA_ARGS"
        fi

        common_args=(
          ./scripts/tests bench
          -c "$BENCH_PERF"
          "--cross-prefix=$BENCH_CROSS_PREFIX"
          "--cflags=$BENCH_CFLAGS $BENCH_ARCHFLAGS"
          "--ldflags=$BENCH_LDFLAGS"
          "--opt=$bench_opt"
          -v
        )

        "${common_args[@]}" --output=output.json "${extra_args[@]}"
        "${common_args[@]}" --components "${extra_args[@]}"
    - name: Check namespace
      shell: ${{ env.SHELL }}
      run: |
        check-namespace
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
      with:
        name: ${{ inputs.name }}
        tool: "customSmallerIsBetter"
        output-file-path: output.json
        github-token: ${{ inputs.gh_token }}
        auto-push: ${{ inputs.store_results == 'true' }}
        comment-on-alert: true
        summary-always: true
        alert-threshold: ${{ inputs.alert_threshold }}
        comment-always: true
    - name: Reset gh-pages if result is not pushed to gh-pages
      shell: ${{ env.SHELL }}
      if: ${{ inputs.store_results != 'true' }}
      run: |
        git -c advice.detachedHead=false switch gh-pages
        git reset --hard HEAD~1
        git checkout -
