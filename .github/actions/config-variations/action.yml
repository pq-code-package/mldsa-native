        alloc: false # Requires custom config
        rng_fail: true
    - name: "MLD_POLY_UNIFORM_NBLOCKS=1"
      if: ${{ inputs.tests == 'all' || contains(inputs.tests, 'nblocks-1') }}
      uses: ./.github/actions/multi-functest
